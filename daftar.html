<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUSAVA — Daftar</title>
  
  <!-- Google Fonts: Plus Jakarta Sans & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  
  <!-- Bespoke Stylesheet -->
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/page-transition.css">
</head>
<body class="bg-[#463F3A] text-[#FDF3D7] font-sans antialiased overflow-x-hidden select-none page-transition-ready">

  <!-- Top Luxury Page Transition Progress Ribbon -->
  <div id="page-transition-bar" aria-hidden="true"></div>

  <!-- SVG Clip Path Definition for Seamless Convex Curve -->
  <svg class="absolute w-0 h-0 overflow-hidden" aria-hidden="true" focusable="false">
    <defs>
      <clipPath id="curvedPanelClip" clipPathUnits="objectBoundingBox">
        <path d="M 0,0 L 0.612,0 C 0.88,0.18 1.0,0.38 1.0,0.58 C 1.0,0.76 0.85,0.92 0.578,1.0 L 0,1.0 Z" />
      </clipPath>
    </defs>
  </svg>

  <!-- Main Viewport Container -->
  <main class="w-screen h-screen min-h-screen relative flex flex-col lg:flex-row overflow-hidden bg-[#463F3A]">
    
    <!-- LEFT VISUAL PANEL (Curved Container with Wayang & Clouds) -->
    <section class="curved-panel-wrapper absolute lg:relative top-0 left-0 h-full w-full lg:w-[54%] flex-shrink-0 z-10 pointer-events-none lg:pointer-events-auto" aria-hidden="true">
      <div class="curved-panel-inner w-full h-full relative overflow-hidden bg-[#FDF3D7]">
        
        <!-- Cloud and Watermark Background Layer -->
        <div class="cloud-parallax-layer absolute inset-0 w-full h-full">
          <img 
            src="assets/images/latar-ornamen-awan-jawa-tradisional-30.png" 
            alt="Mega Mendung dan Ornamen Tradisional Jawa" 
            class="cloud-drift-image absolute left-0 top-0 h-full w-auto min-w-full object-cover object-left select-none pointer-events-none" 
            draggable="false"
          />
        </div>

        <!-- Wayang Puppet Parallax & Idle Wrapper -->
        <div class="wayang-parallax-wrapper absolute z-20 pointer-events-none select-none">
          <div class="wayang-base-angle">
            <div class="wayang-idle-container">
              <img 
                src="assets/images/wayang-kulit-jawa-emas.png" 
                alt="Tokoh Wayang Kulit Jawa Berhias Emas" 
                class="wayang-puppet drop-shadow-wayang select-none pointer-events-none"
                draggable="false"
              />
            </div>
          </div>
        </div>

      </div>
    </section>

    <!-- RIGHT FORM PANEL (NUSAVA Registration Container) -->
    <section class="login-panel-section relative z-20 flex-1 h-full flex flex-col justify-start lg:justify-center items-center px-6 sm:px-10 lg:px-12 py-6 overflow-y-auto no-scrollbar">
      
      <div class="login-container w-full max-w-[380px] flex flex-col mx-auto my-auto py-4">
        
        <!-- Back to Home Link -->
        <div class="w-full flex items-center justify-between mb-3">
          <a href="index.html" class="inline-flex items-center gap-1.5 text-xs text-[#C4BDB7] hover:text-[#F1C469] transition-colors py-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            <span>Kembali ke Beranda</span>
          </a>
        </div>

        <!-- Brand Header (NUSAVA Logo & Ornate Wayang Head) -->
        <header class="brand-header form-reveal form-reveal-1 flex flex-col items-center justify-center w-full">
          <div class="logo-group flex items-center justify-center gap-2.5">
            <img 
              src="assets/images/logonusava.png" 
              alt="NUSAVA Icon" 
              class="nusava-icon h-10 w-auto object-contain select-none"
              draggable="false"
            />
            <span class="nusava-title font-serif font-extrabold text-2xl tracking-[0.14em] uppercase select-none leading-none">
              <span class="text-[#F1C469]">NUSA</span><span class="text-[#AEAC79]">VA</span>
            </span>
          </div>

          <!-- Ornate Horizontal Divider with Center Diamond Accent -->
          <div class="ornate-divider relative flex items-center justify-center w-[400px] max-w-[90vw] mt-3 mb-5 self-center" aria-hidden="true">
            <div class="divider-line w-full h-[1.5px]"></div>
            <div class="divider-diamond absolute w-2 h-2 bg-[#F1C469] rotate-45 shadow-[0_0_8px_rgba(241,196,105,0.85)]"></div>
          </div>
        </header>

        <!-- Typography Heading -->
        <div class="form-title-group form-reveal form-reveal-2 text-left mb-3 w-full">
          <h1 id="pageTitle" class="login-heading font-sans font-bold text-[clamp(30px,3.8vw,38px)] text-[#FDF3D7] tracking-tight leading-tight">
            Daftar
          </h1>
          <p id="pageSubtitle" class="login-subtext text-sm sm:text-[15px] text-[#C4BDB7] font-normal mt-1 tracking-normal">
            Buka studio digital &amp; masuk ekosistem Nusava
          </p>
        </div>

        <!-- Role Switcher Tab -->
        <div class="grid grid-cols-2 p-1 bg-[#322D2A] rounded-lg border border-[#4A433E] mb-3.5 w-full">
          <button type="button" id="roleArtisanBtn" class="py-1.5 px-3 rounded-md text-xs font-semibold text-[#FDF3D7] bg-[#463F3A] transition-all flex items-center justify-center gap-1.5 cursor-pointer">
            <svg class="w-3.5 h-3.5 text-[#F1C469]" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
            <span>Mitra Pengrajin</span>
          </button>
          <button type="button" id="roleBuyerBtn" class="py-1.5 px-3 rounded-md text-xs font-semibold text-[#C4BDB7] hover:text-[#FDF3D7] transition-all flex items-center justify-center gap-1.5 cursor-pointer">
            <svg class="w-3.5 h-3.5 text-[#AEAC79]" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
            <span>Kolektor / Pembeli</span>
          </button>
        </div>

        <!-- Form Element -->
        <form id="registerForm" class="login-form flex flex-col gap-3 w-full" novalidate autocomplete="on">
          
          <!-- Field: Nama Lengkap / Sanggar Maestro -->
          <div class="input-group form-reveal form-reveal-3 flex flex-col gap-1 w-full">
            <label for="nameInput" id="nameLabel" class="input-label text-xs font-semibold text-[#FBEDCC] flex items-center gap-1 select-none">
              Nama Sanggar / Maestro <span class="required-star text-[#FF6262] font-bold" aria-hidden="true">*</span>
            </label>
            <div class="input-wrapper relative w-full">
              <input 
                type="text" 
                id="nameInput" 
                name="name" 
                required 
                placeholder="Contoh: Sanggar Ukir Celuk Maestro Sukadana" 
                class="form-input w-full h-[34px] bg-[#322D2A] text-[#FDF3D7] text-xs px-3 rounded-[5px] border border-[#4A433E] focus:border-[#F1C469] focus:outline-none focus:ring-1 focus:ring-[#F1C469] transition-all duration-200 placeholder-[#FCECCC]/50"
              />
            </div>
            <p id="nameHelper" class="helper-text text-[11px] text-[#C4BDB7] font-normal transition-colors">
              Nama sanggar atau nama lengkap pengrajin
            </p>
          </div>

          <!-- Artisan Specific: Daerah Asal Sentra -->
          <div id="artisanRegionGroup" class="input-group form-reveal flex flex-col gap-1 w-full">
            <label for="regionInput" class="input-label text-xs font-semibold text-[#FBEDCC] flex items-center gap-1 select-none">
              Daerah Sentra Adat <span class="required-star text-[#FF6262] font-bold" aria-hidden="true">*</span>
            </label>
            <div class="input-wrapper relative w-full">
              <input 
                type="text" 
                id="regionInput" 
                name="region" 
                placeholder="Contoh: Desa Celuk &amp; Gianyar, Bali" 
                class="form-input w-full h-[34px] bg-[#322D2A] text-[#FDF3D7] text-xs px-3 rounded-[5px] border border-[#4A433E] focus:border-[#F1C469] focus:outline-none focus:ring-1 focus:ring-[#F1C469] transition-all duration-200 placeholder-[#FCECCC]/50"
              />
            </div>
          </div>

          <!-- Artisan Specific: Kategori Karya Pusaka -->
          <div id="artisanCategoryGroup" class="input-group form-reveal flex flex-col gap-1 w-full">
            <label for="categorySelect" class="input-label text-xs font-semibold text-[#FBEDCC] flex items-center gap-1 select-none">
              Kategori Karya Pusaka <span class="required-star text-[#FF6262] font-bold" aria-hidden="true">*</span>
            </label>
            <div class="input-wrapper relative w-full">
              <select 
                id="categorySelect" 
                name="category"
                class="form-input w-full h-[34px] bg-[#322D2A] text-[#FDF3D7] text-xs px-2.5 rounded-[5px] border border-[#4A433E] focus:border-[#F1C469] focus:outline-none focus:ring-1 focus:ring-[#F1C469] transition-all duration-200 cursor-pointer"
              >
                <option value="Wastra &amp; Kain Tenun Adat">Wastra &amp; Kain Tenun Adat (Ikat, Songket, Batik)</option>
                <option value="Seni Ukir Kayu &amp; Relief">Seni Ukir Kayu &amp; Relief Arsitektur Adat</option>
                <option value="Kerajinan Logam &amp; Keris">Kerajinan Logam, Perak, &amp; Keris Pusaka</option>
                <option value="Anyaman Tradisional Serat Alam">Anyaman Tradisional Serat Alam (Noken, Ketak)</option>
                <option value="Instrumen Musik Tradisional">Instrumen Musik Tradisional (Sasando, Gamelan)</option>
                <option value="Seni Rupa &amp; Lukis Tradisi">Seni Rupa &amp; Lukis Tradisi Nusantara</option>
              </select>
            </div>
          </div>

          <!-- Email Input Group -->
          <div class="input-group form-reveal form-reveal-4 flex flex-col gap-1 w-full">
            <label for="emailInput" class="input-label text-xs font-semibold text-[#FBEDCC] flex items-center gap-1 select-none">
              Alamat Email <span class="required-star text-[#FF6262] font-bold" aria-hidden="true">*</span>
            </label>
            <div class="input-wrapper relative w-full">
              <input 
                type="email" 
                id="emailInput" 
                name="email" 
                required 
                autocomplete="email" 
                placeholder="nama@nusava.id" 
                class="form-input w-full h-[34px] bg-[#322D2A] text-[#FDF3D7] text-xs px-3 rounded-[5px] border border-[#4A433E] focus:border-[#F1C469] focus:outline-none focus:ring-1 focus:ring-[#F1C469] transition-all duration-200 placeholder-[#FCECCC]/50"
              />
            </div>
            <p id="emailHelper" class="helper-text text-[11px] text-[#C4BDB7] font-normal transition-colors">
              Gunakan email aktif untuk verifikasi kemitraan
            </p>
          </div>

          <!-- Password & Konfirmasi Grid -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 w-full">
            <!-- Password Input -->
            <div class="input-group form-reveal flex flex-col gap-1 w-full">
              <label for="passwordInput" class="input-label text-xs font-semibold text-[#FBEDCC] flex items-center gap-1 select-none">
                Kata Sandi <span class="required-star text-[#FF6262] font-bold" aria-hidden="true">*</span>
              </label>
              <div class="input-wrapper relative w-full">
                <input 
                  type="password" 
                  id="passwordInput" 
                  name="password" 
                  required 
                  autocomplete="new-password" 
                  placeholder="Min. 6 Karakter" 
                  class="form-input password-input w-full h-[34px] bg-[#322D2A] text-[#FDF3D7] text-xs pl-3 pr-8 rounded-[5px] border border-[#4A433E] focus:border-[#F1C469] focus:outline-none focus:ring-1 focus:ring-[#F1C469] transition-all duration-200 placeholder-[#FCECCC]/50"
                />
                <button 
                  type="button" 
                  id="togglePasswordBtn" 
                  class="toggle-eye-btn absolute right-2 top-1/2 -translate-y-1/2 p-1 text-[#FFF8EE]/65 hover:text-[#F1C469] focus:outline-none transition-colors" 
                  aria-label="Tampilkan password"
                >
                  <svg id="eyeOpenSvg" class="w-4 h-3.5 block" viewBox="0 0 25 15" fill="none" stroke="currentColor">
                    <path opacity="0.9" d="M24.5377 6.38786C25.1541 7.05214 25.1541 7.94893 24.5377 8.61214C22.5963 10.7004 17.9385 15 12.5005 15C7.06255 15 2.40476 10.7004 0.463357 8.61214C0.163054 8.29422 0 7.90286 0 7.5C0 7.09714 0.163054 6.70578 0.463357 6.38786C2.40476 4.29964 7.06255 0 12.5005 0C17.9385 0 22.5963 4.29964 24.5377 6.38786Z" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="12.5" cy="7.5" r="3.2" stroke-width="1.6"/>
                  </svg>
                  <svg id="eyeSlashSvg" class="w-4 h-3.5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Confirm Password Input -->
            <div class="input-group form-reveal flex flex-col gap-1 w-full">
              <label for="confirmPasswordInput" class="input-label text-xs font-semibold text-[#FBEDCC] flex items-center gap-1 select-none">
                Ulangi Sandi <span class="required-star text-[#FF6262] font-bold" aria-hidden="true">*</span>
              </label>
              <div class="input-wrapper relative w-full">
                <input 
                  type="password" 
                  id="confirmPasswordInput" 
                  name="confirmPassword" 
                  required 
                  autocomplete="new-password" 
                  placeholder="Ulangi Sandi" 
                  class="form-input password-input w-full h-[34px] bg-[#322D2A] text-[#FDF3D7] text-xs pl-3 pr-3 rounded-[5px] border border-[#4A433E] focus:border-[#F1C469] focus:outline-none focus:ring-1 focus:ring-[#F1C469] transition-all duration-200 placeholder-[#FCECCC]/50"
                />
              </div>
            </div>
          </div>

          <!-- Submit Button (Pill Shaped CTA) -->
          <div class="cta-wrapper form-reveal form-reveal-5 mt-2 w-full">
            <button 
              type="submit" 
              id="submitBtn" 
              class="cta-button w-full h-[38px] rounded-full bg-[#F3C66F] hover:bg-[#fad88b] text-[#4D4542] font-bold text-xs tracking-wider uppercase transition-all duration-300 shadow-md hover:shadow-[0_0_22px_rgba(243,198,111,0.5)] active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-[#F1C469] flex items-center justify-center gap-2 cursor-pointer"
            >
              <span id="btnText">Daftarkan Sanggar &amp; Buka Studio</span>
              <svg id="btnSpinner" class="animate-spin -ml-1 mr-2 h-4 w-4 text-[#4D4542] hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
              </svg>
            </button>
          </div>

          <!-- Footer Login Prompt -->
          <div class="form-footer form-reveal form-reveal-6 text-center mt-2 text-xs text-[#C4BDB7]">
            <span>Sudah memiliki akun terdaftar?</span>
            <a href="login.html" id="loginLink" class="register-link text-[#F1C469] font-semibold hover:underline hover:text-[#fad88b] transition-colors ml-1">
              Masuk
            </a>
          </div>

          <!-- Quick Demo Accounts for Competition Judges -->
          <div class="mt-3 pt-3 border-t border-[#4A433E]/70 flex flex-col gap-1.5 w-full">
            <div class="flex items-center justify-between text-[11px] text-[#C4BDB7]">
              <span class="font-medium">Preset Cepat Demo Juri:</span>
              <span class="text-[9px] uppercase tracking-wider text-[#F1C469] font-semibold">1-Klik Lengkap</span>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <button type="button" id="demoArtisanPreset" class="py-1.5 px-2.5 rounded-md bg-[#241B16] hover:bg-[#322D2A] border border-[#F1C469]/50 text-[#F1C469] text-[11px] font-semibold text-center transition-all hover:scale-[1.02] flex items-center justify-center gap-1.5 shadow-sm cursor-pointer">
                <svg class="w-3.5 h-3.5 text-[#F1C469]" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                <span>Maestro Bali</span>
              </button>
              <button type="button" id="demoBuyerPreset" class="py-1.5 px-2.5 rounded-md bg-[#241B16] hover:bg-[#322D2A] border border-[#AEAC79]/50 text-[#AEAC79] text-[11px] font-semibold text-center transition-all hover:scale-[1.02] flex items-center justify-center gap-1.5 shadow-sm cursor-pointer">
                <svg class="w-3.5 h-3.5 text-[#AEAC79]" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                <span>Kolektor Wastra</span>
              </button>
            </div>
          </div>

        </form>

        <!-- Notification Toast (Success / Notice) -->
        <div id="formToast" class="toast-notification fixed bottom-6 right-6 bg-[#322D2A] border border-[#F1C469] text-[#FDF3D7] px-4 py-3 rounded-lg shadow-2xl flex items-center gap-3 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none z-50" role="alert">
          <svg class="w-5 h-5 text-[#F1C469] flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span id="toastMessage" class="text-xs sm:text-sm font-medium"></span>
        </div>

      </div>

    </section>

  </main>

  <!-- External Scripts -->
  <script src="js/daftar.js"></script>
  <script src="js/page-transition.js"></script>
</body>
</html>
